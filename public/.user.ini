; PHP per-directory overrides for the NOC app (PHP-FPM reads .user.ini from the
; script's directory; index.php lives here, so these apply to every request).
;
; Both settings are PHP_INI_PERDIR, which is why they can live here at all —
; they cannot be set from ini_set() at runtime.
;
; Why they are raised: the app deliberately accepts large uploads. The Download
; Center streams artifacts up to 2 GB, and the phone firmware library takes
; Grandstream packages of 60–150 MB. With PHP's stock 2M/8M an upload of either
; dies before the controller ever runs.
;
; nginx has its own, separate ceiling (client_max_body_size, default 1m) which
; rejects the request earlier still, with a bare 413 page. That one is set in
; deployment/firmware/setup.sh — raising only one of the two does nothing.
;
; post_max_size must stay above upload_max_filesize: it caps the whole request
; body, of which the file is only part.
;
; Changes here are picked up within user_ini.cache_ttl (300s by default), no
; restart needed.

upload_max_filesize = 512M
post_max_size = 520M

; A 150 MB upload over a branch VPN takes a while; the default 60s cuts it off
; mid-transfer and the operator sees a blank failure.
max_input_time = 600
