# → /etc/systemd/resolved.conf.d/sg-dns.conf
#
# Upstream is dnsmasq on 127.0.0.1, which does the per-domain split:
# sgprd / sgapps-test to a public resolver (they exist only in the PUBLIC
# samirgroup.com zone), everything else to the internal AD DNS 172.16.8.4/.5.
# See sg-split-dns.conf alongside this file.
#
# Do NOT put 172.16.8.4/.5 back here directly: the AD servers are authoritative
# for samirgroup.com and answer NXDOMAIN for the public hosts, which is the bug
# this whole arrangement exists to work around.
[Resolve]
DNS=127.0.0.1
Domains=~.
