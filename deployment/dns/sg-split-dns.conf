# Split-brain DNS for the NOC.  →  /etc/dnsmasq.d/sg-split-dns.conf
#
# The internal AD DNS is authoritative for samirgroup.com and holds only the
# internal records, so hosts published in the PUBLIC samirgroup.com zone
# (sgprd, sgapps-test — the ticketing API, behind Oracle Cloud WAF) come back
# NXDOMAIN and every outbound call dies as "could not resolve host".
#
# dnsmasq forwards those names to a public resolver and everything else to the
# AD servers. Queries leave with the host's normal source address over eth0,
# which is the whole point — see the README for what happens when they do not.

listen-address=127.0.0.1
bind-interfaces
port=53

# Never read /etc/resolv.conf: it points back at us.
no-resolv
no-poll

# Default: the internal AD DNS, exactly as before.
server=172.16.8.4
server=172.16.8.5

# The exceptions. Add new public-zone hosts here, one server= line each.
server=/sgprd.samirgroup.com/1.1.1.1
server=/sgprd.samirgroup.com/8.8.8.8
server=/sgapps-test.samirgroup.com/1.1.1.1
server=/sgapps-test.samirgroup.com/8.8.8.8

cache-size=1000
domain-needed
bogus-priv
