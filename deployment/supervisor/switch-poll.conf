; The Laravel scheduler — the ONLY thing that should start `schedule:run`.
; The program name is historical; this runs every task in routes/console.php.
;
; schedule:work starts one `schedule:run` at the top of each minute and streams
; its output here, so this out log holds every foreground task's duration.
; It must not be `schedule:run` itself: supervisor restarts a program the moment
; it exits, so a run that finished early re-ran that minute's tasks. And there
; must be no `schedule:run` crontab entry as well — that double-fires them too.
;
; stopasgroup/killasgroup are off on purpose: runInBackground tasks share this
; process group, and killing them on a restart would leave their overlap locks
; held until expiry (identity:sync: 4 h). Stopping this program stops the
; minute timer; in-flight tasks finish on their own.
[program:switch-poll]
command=php /home/azureuser/phonebook2/artisan schedule:work
directory=/home/azureuser/phonebook2
autostart=true
autorestart=true
stopasgroup=false
killasgroup=false
stderr_logfile=/var/log/supervisor/switch-poll.err.log
stdout_logfile=/var/log/supervisor/switch-poll.out.log
user=azureuser
